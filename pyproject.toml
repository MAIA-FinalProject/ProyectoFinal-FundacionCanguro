[project]
name = "proyecto-canguro"
version = "0.1.0"
description = "Proyecto de grado Fundación Canguro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "pandas",
    "scikit-learn",
    "pydantic-settings",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
    "dvc[gdrive]>=3.67.1",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
]

[tool.uv]
# pydrive2 (dvc[gdrive]) exige pyOpenSSL<=24.2.1; sin esta restricción uv elige
# pyOpenSSL 22.0.0, incompatible con cryptography reciente ("no attribute GEN_EMAIL").
constraint-dependencies = ["pyopenssl>=24.2.1"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true

# src/data/imputation.py importa contracts/patient.py, que tiene errores de tipos
# propios del ticket 2.4. No se reportan al seguir el import; `mypy contracts/`
# los sigue mostrando.
[[tool.mypy.overrides]]
module = ["contracts", "contracts.*"]
follow_imports = "silent"
