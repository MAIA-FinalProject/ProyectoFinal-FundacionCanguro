[project]
name = "proyecto-canguro"
version = "0.1.0"
description = "Proyecto de grado Fundación Canguro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "pandas",
    "scikit-learn",
    "pydantic-settings",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
    "dvc[gdrive]>=3.67.1",
]

[tool.uv]
# pydrive2 (dvc[gdrive]) exige pyOpenSSL<=24.2.1; sin esta restricción uv elige
# pyOpenSSL 22.0.0, incompatible con cryptography reciente ("no attribute GEN_EMAIL").
constraint-dependencies = ["pyopenssl>=24.2.1"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
